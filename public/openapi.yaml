openapi: 3.0.3
info:
  title: NetOne Investment Intelligence API
  version: 0.4.0
  description: Authenticated synthetic decision service. Legacy Econet routes return 410.
paths:
  /api/netone:
    get:
      summary: Session, scenario snapshots or authorised audit records
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum: [session, scenarios, audit]
      responses:
        '200':
          description: Session metadata or authorised records
        '401':
          description: Authentication required
        '403':
          description: Role policy denied access
    post:
      summary: Login, logout, compute, save or authorise an evidence export
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum: [login, logout, run, scenarios, export]
        - in: query
          name: id
          schema:
            type: string
            format: uuid
      requestBody:
        description: Credentials for login; input and name for scenario commands; empty object for logout/export. Origin must match configured origin. Cookie session is HttpOnly.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Login, computation, logout or export evidence
        '201':
          description: Immutable scenario and audit committed
        '400':
          description: Invalid or infeasible input
        '401':
          description: Invalid credentials/session
        '403':
          description: Same-origin or server role check failed
        '429':
          description: Login attempts limited
        '503':
          description: Dedicated NetOne configuration or storage unavailable
